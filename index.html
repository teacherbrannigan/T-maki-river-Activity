<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>NZ CIVIL DEFENCE // SUB-SURFACE BUNKER SYSTEM</title>
  <style>
    :root {
      --cd-yellow: #ffcc00;
      --cd-orange: #ff6600;
      --cd-blue: #003366;
      --cd-dark: #12161a;
      --cd-panel: #1e242b;
      --cd-border: #333d47;
      --cd-green: #00ff66;
      --cd-text: #ffffff;
      --cd-font: Arial, Helvetica, sans-serif;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--cd-dark);
      color: var(--cd-text);
      font-family: var(--cd-font);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* HEADER BAR */
    header {
      background-color: var(--cd-blue);
      border-bottom: 4px solid var(--cd-yellow);
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .badge {
      background-color: var(--cd-yellow);
      color: #000;
      font-weight: bold;
      padding: 4px 8px;
      border-radius: 3px;
      letter-spacing: 1px;
      font-size: 0.85rem;
    }

    .title {
      font-size: 1rem;
      font-weight: bold;
      letter-spacing: 1.5px;
      color: #fff;
    }

    .status-bar {
      display: flex;
      gap: 16px;
      font-size: 0.8rem;
    }

    .status-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .indicator {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: var(--cd-green);
      box-shadow: 0 0 8px var(--cd-green);
    }

    .indicator.alert {
      background-color: var(--cd-orange);
      box-shadow: 0 0 8px var(--cd-orange);
      animation: blink 1s infinite;
    }

    @keyframes blink {
      50% { opacity: 0.3; }
    }

    /* MAIN CONTAINER */
    main {
      flex: 1;
      padding: 16px;
      display: flex;
      justify-content: center;
      align-items: stretch;
      overflow: hidden;
    }

    .bunker-card {
      background-color: var(--cd-panel);
      border: 2px solid var(--cd-border);
      border-radius: 8px;
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      overflow: hidden;
    }

    .card-header {
      background-color: #171c22;
      border-bottom: 1px solid var(--cd-border);
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: #8899a6;
      flex-shrink: 0;
    }

    .card-body {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    /* STRICT STAGE ISOLATION */
    .stage {
      display: none !important;
      flex-direction: column;
      height: 100%;
      justify-content: space-between;
    }

    .stage.active {
      display: flex !important;
    }

    h1, h2, h3 {
      color: var(--cd-yellow);
      margin-top: 0;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-size: 1.3rem;
    }

    p {
      line-height: 1.5;
      font-size: 1rem;
      color: var(--cd-text);
    }

    /* BRIEFING BOX */
    .briefing-box {
      background-color: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--cd-border);
      border-left: 5px solid var(--cd-yellow);
      padding: 14px 16px;
      border-radius: 4px;
      margin-bottom: 16px;
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .briefing-title {
      color: var(--cd-yellow);
      font-weight: bold;
      font-size: 0.85rem;
      letter-spacing: 1px;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    /* MEDIA CONTAINER */
    .media-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: center;
      width: 100%;
      margin-bottom: 16px;
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      max-width: 500px;
      height: min(40vh, 280px);
      aspect-ratio: 16 / 9;
      background-color: #000;
      border: 2px solid var(--cd-yellow);
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.7);
      flex-shrink: 0;
    }

    .video-wrapper video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .transcript-box {
      width: 100%;
      background-color: rgba(10, 14, 18, 0.85);
      border: 1px solid var(--cd-border);
      border-left: 5px solid var(--cd-yellow);
      padding: 16px;
      border-radius: 4px;
      font-size: 1rem;
      line-height: 1.6;
      color: #ffffff;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
    }

    .transcript-title {
      color: var(--cd-yellow);
      font-weight: bold;
      font-size: 0.85rem;
      letter-spacing: 1px;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    /* ROOM 1 PARAGRAPH BUTTON GRID */
    .paragraph-options-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin: 16px 0;
    }

    .para-opt-btn {
      background-color: #000000 !important;
      border: 2px solid var(--cd-border);
      border-radius: 6px;
      padding: 16px;
      text-align: left;
      cursor: pointer;
      font-family: var(--cd-font);
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .para-opt-btn:hover {
      border-color: var(--cd-yellow);
      background-color: #111111 !important;
    }

    .para-btn-title {
      font-weight: bold;
      color: #ffffff !important;
      font-size: 1.05rem;
      letter-spacing: 1px;
    }

    .para-btn-body {
      color: #ffffff !important;
      font-size: 0.9rem;
      line-height: 1.5;
      margin: 0;
      white-space: pre-line;
    }

    /* ROOM 2 ZOOMABLE IMAGE CONTAINER WITH HARD EDGE BOUNDARIES */
    .zoom-viewer-container {
      position: relative;
      width: 100%;
      height: 320px;
      background-color: #000;
      border: 2px solid var(--cd-yellow);
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 16px;
      touch-action: none;
    }

    .zoom-viewport {
      width: 100%;
      height: 100%;
      cursor: grab;
      position: relative;
      overflow: hidden;
    }

    .zoom-viewport:active {
      cursor: grabbing;
    }

    .zoom-image {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform-origin: 0 0;
      transition: transform 0.05s ease-out;
      pointer-events: none;
    }

    .zoom-controls {
      position: absolute;
      bottom: 12px;
      right: 12px;
      display: flex;
      gap: 6px;
      z-index: 10;
    }

    .ctrl-btn {
      background-color: #000000;
      color: #ffffff;
      border: 1px solid var(--cd-yellow);
      font-family: var(--cd-font);
      font-weight: bold;
      font-size: 1rem;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
    }

    .ctrl-btn:hover {
      background-color: var(--cd-yellow);
      color: #000;
    }

    /* ROOM 2 INPUT BOX */
    .answer-box {
      background-color: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--cd-border);
      padding: 16px;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .input-group {
      display: flex;
      gap: 10px;
    }

    .text-input {
      flex: 1;
      background-color: #000000;
      border: 2px solid var(--cd-border);
      color: #ffffff;
      font-family: var(--cd-font);
      font-size: 1.1rem;
      padding: 12px 16px;
      border-radius: 4px;
      letter-spacing: 1px;
    }

    .text-input:focus {
      outline: none;
      border-color: var(--cd-yellow);
    }

    /* FEEDBACK ALERTS */
    .feedback-alert {
      padding: 12px 16px;
      border-radius: 4px;
      font-size: 0.9rem;
      margin-top: 10px;
      display: none;
    }

    .feedback-alert.error {
      display: block;
      background-color: rgba(255, 102, 0, 0.2);
      border: 1px solid var(--cd-orange);
      color: var(--cd-orange);
    }

    .feedback-alert.success {
      display: block;
      background-color: rgba(0, 255, 102, 0.15);
      border: 1px solid var(--cd-green);
      color: var(--cd-green);
    }

    /* NAVIGATION BUTTONS */
    .action-zone {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px dashed var(--cd-border);
      display: flex;
      justify-content: flex-end;
      flex-shrink: 0;
    }

    .btn {
      background-color: #000000;
      color: #ffffff;
      border: 2px solid var(--cd-yellow);
      padding: 14px 28px;
      font-size: 0.95rem;
      font-weight: bold;
      font-family: var(--cd-font);
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-radius: 4px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 0 #cca300;
    }

    .btn:hover {
      background-color: #111111;
      color: #ffffff;
    }

    .btn:active {
      transform: translateY(4px);
      box-shadow: 0 0 0 #cca300;
    }

    .btn-danger {
      background-color: #000000;
      border-color: var(--cd-orange);
      color: #ffffff;
      box-shadow: 0 4px 0 #cc5200;
    }

    .btn-danger:hover {
      background-color: #111111;
      color: #ffffff;
    }

    .btn-danger:active {
      box-shadow: 0 0 0 #cc5200;
    }

    /* FOOTER TRACKER */
    footer {
      background-color: #0b0e11;
      border-top: 1px solid var(--cd-border);
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      flex-shrink: 0;
    }

    .progress-tracker {
      display: flex;
      gap: 10px;
    }

    .step-dot {
      width: 28px;
      height: 10px;
      background-color: var(--cd-border);
      border-radius: 3px;
      transition: all 0.3s ease;
    }

    /* COMPLETED DOT INTERACTIVITY */
    .step-dot.completed {
      background-color: var(--cd-green);
      cursor: pointer;
      box-shadow: 0 0
